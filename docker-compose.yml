version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hearbridge-postgres
    restart: always
    environment:
      POSTGRES_USER: hearbridge_admin
      POSTGRES_PASSWORD: admin_secret_password_123
      POSTGRES_DB: hearbridge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hearbridge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.2
    container_name: hearbridge-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hearbridge-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://hearbridge_admin:admin_secret_password_123@postgres:5432/hearbridge_db?schema=public
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=super_secret_jwt_key_for_hearbridge_ai_2026
      - JWT_REFRESH_SECRET=refresh_super_secret_jwt_key_2026
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
      - elasticsearch

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hearbridge-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
